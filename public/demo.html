<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Tours (demo host site)</title>
    <style>
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1f2937; background: #f3f4f6; }
      header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: #fff; border-bottom: 1px solid #e5e7eb; }
      header strong { margin-right: auto; }
      nav a { margin-right: 16px; color: #374151; text-decoration: none; }
      main { max-width: 900px; margin: 32px auto; padding: 0 16px; }
      .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
      button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
      #new-project { background: #111827; color: #fff; border-color: #111827; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
    </style>
    <!-- Snippet, as shown on the Install page (demo key from the seed). -->
    <script>
      window.LocatifyGuides = window.LocatifyGuides || { q: [] };
      ["identify", "track", "start", "page", "reset"].forEach(function (m) {
        LocatifyGuides[m] = LocatifyGuides[m] || function () { LocatifyGuides.q.push([m, arguments]); };
      });
    </script>
    <script async src="/sdk.js" data-key="pk_demo"></script>
  </head>
  <body>
    <header>
      <strong>Acme Tours</strong>
      <nav><a id="nav-projects" href="#projects">Projects</a><a href="#docs">Docs</a></nav>
      <button id="settings">Settings</button>
      <button id="help">Help</button>
    </header>
    <main>
      <div class="card">
        <h1>Projects</h1>
        <p>This page stands in for a customer's app so you can try guides locally.</p>
        <div class="row">
          <button id="new-project" onclick="LocatifyGuides.track('project_created'); alert('Project created (tracked project_created)')">
            + New project
          </button>
          <button onclick="history.pushState({}, '', '/demo.html?page=' + Date.now())">Simulate SPA navigation</button>
        </div>
      </div>
      <div class="card">
        <h2>Test as a user</h2>
        <div class="row">
          <input id="uid" placeholder="user id, e.g. alice" style="padding:8px;border:1px solid #d1d5db;border-radius:8px" />
          <button onclick="LocatifyGuides.identify(document.getElementById('uid').value, { plan: 'pro' })">Identify</button>
          <button onclick="LocatifyGuides.reset()">Reset (new anonymous visitor)</button>
        </div>
      </div>
    </main>
  </body>
</html>
